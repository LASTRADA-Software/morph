# Codecov configuration.
#
# Coverage is produced by the `clang-coverage` CI job via scripts/coverage.sh:
# always include/morph (the library), plus examples/common (the ladder's
# hand-written app/testkit code — real coverage of morph's own client stack,
# not app-specific logic; see examples/TESTING.md's "round-7 T4 reframe") and
# every built rung's own models/app/screens code, whenever that leg's
# configure also builds the ladder. Tests, demo src/, fetched dependencies, and
# AUTOMOC-generated files (which live under the build tree, never under a
# source-tree path this config names) are excluded.

coverage:
  status:
    # Default (include/morph, i.e. everything not claimed by a component
    # below): informational only, unchanged from before this file started
    # tracking the ladder. This project's own IMPLEMENTATION.md rule 5 has
    # never claimed the whole library is 100% covered — only "models" (and
    # now the ladder's hand-written GUI/testkit code, see the component
    # below) carry that promise. Note that no status in this file blocks
    # today: the ladder's components are informational because the ladder
    # is a detector, and its coverage rule is a target, not a gate.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The ladder's hand-written GUI/testkit code is held to the same 100% bar
# examples/IMPLEMENTATION.md rule 5 sets for models (there are no rung
# models yet — rung 0 ships no app — so this component is the whole of that
# promise today; src/models/ and include/<rung>/models/ join it as rungs
# land). Scoped to examples/common specifically, not project-wide: a
# gate over the *entire* codebase is a much bigger, unverified claim this
# repo has never made and this change does not attempt.
#
# The target sat at 98% (not a literal 100%) for a measurement-tooling reason
# rather than an intentional gap, and the reasoning still explains why a
# ladder component can never honestly read 100%: llvm-cov's source-based coverage places a
# "control reached past this block" counter on the closing brace of certain
# blocks (a switch-case's `}` after `break;`, a scope's `}` after its one
# statement calls a `std::function<void()>`), and that counter can read 0
# even though the statement immediately above it — proven by its own hit
# count — ran. There is no llvm-cov equivalent of gcov's inline
# `LCOV_EXCL_LINE` to suppress just those lines. Confirmed present-day
# instances, all in hand-written (non-test) files, each already directly
# exercised by an existing test per llvm-cov's own count on the preceding
# line: backend_rig.hpp's three switch-case closing braces (BackendRig's
# constructor, one per Mode), strand_interleaver.hpp's two post-`task()`
# closing braces (`step()`, `runSchedule()`), and fault_proxy.cpp's one
# integration-unreachable line pair (onClientConnection's null-guard —
# Qt's own newConnection contract guarantees a valid pointer in practice;
# the underlying decision, isValidIncomingConnection, is unit-tested
# directly). Together these put today's real ceiling at 478/485 = 98.56%
# lines — re-measured at rung 1's close, when `examples/common` gained
# `db_busy_fixture.hpp` and `backend_rig.hpp`'s executor-liveness guard. The
# artifact *list* above is unchanged (the same seven lines); only the
# denominator moved. 98% leaves a small margin below that measured ceiling
# rather than sitting exactly on it, while still failing the gate long before
# a real, newly-introduced gap could hide behind this handful of known
# artifacts.
#
# Per-rung components, one per rung, rather than one component spanning the
# whole ladder: each rung's real ceiling is set by its own handful of known
# artifacts, and folding them together would mean re-deriving a single number
# every time a rung lands. A rung's component simply appears when its
# directory does.
component_management:
  individual_components:
    # ── The framework itself ────────────────────────────────────────────────
    #
    # Every other component below is under examples/. Until this one existed,
    # include/morph -- the product, and the largest single thing in the report
    # -- was scored only by the `default` status above, which carries no target
    # at all. The library was the one part of this repository with no stated
    # number to hold to, while eight example applications each had one
    # (morph#402).
    #
    # Where 93% comes from, and what has to happen to it. Measured over the
    # LCOV this repository actually uploads (build/clang-coverage/coverage.lcov,
    # after scripts/aggregate_lcov_branches.py), by Codecov's own arithmetic: a
    # DA line with zero hits is a miss, a hit line carrying an untaken BRDA
    # branch is a partial, and coverage is hits / (hits + misses + partials).
    # That gave 7,977 hits of 8,488 lines = 93.98%, with 332 misses and 179
    # partials, so 93% leaves the same small margin below a measured ceiling
    # that every target in this file leaves.
    #
    # Where the number lives, so a regression is legible rather than averaged
    # away:
    #     net       77.61%   1,157 lines   193 misses,  66 partials
    #     forms     94.68%   1,560 lines    58 misses,  25 partials
    #     offline   91.94%     633 lines    36 misses,  15 partials
    #     core      97.35%   3,249 lines    35 misses,  51 partials
    #     util      97.83%   1,012 lines     4 misses,  18 partials
    #     session   97.19%     249 lines     4 misses,   3 partials
    #     qt        97.44%      39 lines     1 miss,     0 partials
    #     journal   99.44%     357 lines     1 miss,     1 partial
    #     detail   100.00%     155 lines
    #     render   100.00%      77 lines
    # One subsystem carries the whole gap: net is 26% of the library's misses
    # in 14% of its lines. That is not a surprise -- morph#403 is the reason
    # anyone can see it, since include/morph/net contributed *zero files* to
    # every report before it.
    #
    # **This target is provisional and must be re-derived from the first
    # Codecov report produced after morph#403 lands.** Two reasons, and the
    # second is the one that matters. First, the method reproduces Codecov
    # to about a third of a point (examples/common: 90.72% computed here
    # against 90.39% from the Codecov API on master) rather than exactly --
    # the compiler is not a source of the discrepancy: it was measured on
    # clang 22.1.8 and CI pins clang 22.
    # Second, and unavoidably: morph#403 moved the *denominator*. Handing
    # llvm-cov the binaries whose profile data it used to drop brought whole
    # files into the report that had never been in it, so include/morph's line
    # count is not the 5,716 the API reported for master and the two numbers
    # cannot be reconciled by adjusting anything. The measurement has to be
    # retaken, not corrected -- which is what morph#403 said would happen.
    #
    # Re-measured after the 2026-09 framework-coverage-and-mutation plan
    # (docs/superpowers/plans/2026-09-03-framework-coverage-and-mutation.md)
    # closed the gap the paragraphs above describe. Same file this
    # repository actually uploads (build/clang-coverage/coverage.lcov,
    # post-aggregate_lcov_branches.py) and the same Codecov-style arithmetic
    # (a DA line with zero hits is a miss, a hit line with an untaken BRDA
    # branch is a partial, coverage is hits / (hits + misses + partials)) --
    # but NOT the same configure as the 93.98% figure above or as CI's
    # coverage leg: this run used MORPH_BUILD_NET/OFFLINE_SQLITE/QT=ON
    # without MORPH_BUILD_LADDER=ON (Mull/mutation infrastructure being
    # unavailable on this machine made the full CI-matching build worth
    # skipping rather than fighting for a bookkeeping-only re-measurement).
    # LADDER cannot change which include/morph files appear in the
    # denominator (it only builds examples/'s own testkit/GUI
    # infrastructure and rungs), but its test binaries do exercise
    # include/morph and would add hits CI's own report will have that this
    # number doesn't -- so 98.10% below is a lower bound on what CI's own
    # coverage leg will show for this same tree, not an exact reproduction
    # of it. Against a full net + forms + core + offline audit-close-
    # remeasure pass, not just the net addition that made the 93% figure
    # provisional: 8,502 hits of 8,667 lines = 98.10%, 80 misses, 85
    # partials:
    #
    #     net       94.69%   1,262 lines    39 misses,  28 partials
    #     forms     98.43%   1,590 lines    10 misses,  15 partials
    #     offline   96.56%     639 lines    11 misses,  11 partials
    #     core      98.88%   3,292 lines    16 misses,  21 partials
    #     util      98.91%   1,007 lines     2 misses,   9 partials
    #     session   98.80%     249 lines     2 misses,   1 partial
    #     qt       100.00%      39 lines
    #     journal  100.00%     357 lines
    #     detail   100.00%     155 lines
    #     render   100.00%      77 lines
    #
    # net -- the subsystem that carried the whole gap above -- is no longer
    # an outlier: every subsystem now sits at or above 94.69%, and the four
    # this plan actually touched (net, forms, offline, core) each moved by
    # double digits or, for core (already high), by the largest remaining
    # absolute miss count. The branch-coverage view
    # (scripts/check_branch_coverage.py, the stricter of the two measures
    # since a hit line with one untaken arm still counts against it) moved
    # from 91.19% to 95.95% over the same work, with every subsystem clear
    # of its own floor in scripts/check_branch_coverage.py's FLOORS table.
    #
    # 97%, a margin below the 98.10% measured ceiling on the same terms
    # every other target in this file leaves (roughly a point, not sitting
    # on the number). informational: true is unchanged, for the same reason
    # as before: the decision to make this blocking is the repo owner's,
    # recorded once the ladder is finished, and this component changes what
    # the file *says* about the framework, not what it enforces.
    - component_id: framework
      name: "morph framework (include/morph)"
      paths:
        - include/morph/**
      statuses:
        - type: project
          target: 97%
          informational: true
        - type: patch
          target: 97%
          informational: true

    # include/morph/offline and include/morph/forms, each split out of
    # `framework` above so the subsystem can produce a status of its own
    # (morph#453 item D).
    #
    # Neither had a `component_id` until now, and the consequence was that
    # neither could ever go red. `framework` scores all of include/morph as
    # one number, and include/morph/offline is 639 of its 8,667 lines --
    # offline sliding from 96% to 60% moves the whole-library figure by
    # about two and a half points and names no subsystem while doing it.
    # This is the same hole this file already records one level down for the
    # rungs ("a gate, since removed, checked that each rung has a
    # `component_id`, not that it has these, so the omission was
    # unguarded"), and the fix is the same: a component per thing you want
    # to be able to see move.
    #
    # The paths deliberately overlap `framework`'s `include/morph/**`.
    # Codecov scores each component independently, so these files are still
    # counted there too; this adds a narrower second view rather than
    # carving the first one up. `framework`'s own 97% target is unchanged
    # and still measured over the whole library.
    #
    # Both targets come from the same audit-close-remeasure run recorded in
    # the `framework` comment above -- same uploaded file
    # (build/clang-coverage/coverage.lcov, post-aggregate_lcov_branches.py),
    # same Codecov-style arithmetic, and so the same caveat: that run
    # configured NET/OFFLINE_SQLITE/QT without LADDER, whose test binaries
    # would add hits to include/morph, so each figure is a lower bound on
    # what CI's own coverage leg reports for this tree.
    #
    #     offline    96.56%     639 lines    11 misses,  11 partials
    #     forms      98.43%   1,590 lines    10 misses,  15 partials
    #
    # Both were re-derived from an independent local run of CI's own
    # clang-coverage configure (NET/OFFLINE_SQLITE/QT/LADDER all ON, rungs
    # `all`, 2,706 tests, all passing), which lands on offline 96.56% /
    # 639 lines / 11 misses / 11 partials -- the same figures to the digit --
    # and forms 98.60% / 1,577 lines / 10 misses / 12 partials, a shade above
    # the LADDER-less 98.43% for exactly the reason named above. Both targets
    # keep their margin under either measurement.
    #
    # `offline` also answers morph#453 item C, which asked for the before
    # *and* the after for the one header the 85.20% subsystem figure was
    # hiding. On the same Codecov arithmetic:
    #
    #     include/morph/offline/sqlite_offline_queue.hpp
    #         before (morph#409)   57.04%    52 misses,  12 partials
    #         after                91.53%   189 lines,   8 misses, 8 partials
    #
    # Most of that move is reporting, not tests: morph#403 is why the header
    # had a denominator at all (`morph_offline_sqlite_tests` was never handed
    # to llvm-cov, so its hits were dropped). Not all of it, though, which is
    # why this branch still closed six genuine gaps in that header and
    # documented the two it could not reach -- and why the honest answer to
    # #409's "if it barely moves, the suite is thin" is that the suite was
    # not thin, only invisible.
    #
    # Targets sit roughly a point below each measured ceiling, the same
    # margin convention every other target in this file uses, so an ordinary
    # refactor does not trip them while a real regression does.
    # `informational: true` on both, matching `framework` and every ladder
    # component: this changes what the file can *see*, not what it enforces.
    # Making any of it blocking is the repo owner's decision (morph#133).
    - component_id: offline
      name: "morph offline queue (include/morph/offline)"
      paths:
        - include/morph/offline/**
      statuses:
        - type: project
          target: 95%
          informational: true
        - type: patch
          target: 95%
          informational: true

    - component_id: forms
      name: "morph forms (include/morph/forms)"
      paths:
        - include/morph/forms/**
      statuses:
        - type: project
          target: 97%
          informational: true
        - type: patch
          target: 97%
          informational: true

    - component_id: ladder
      name: "application ladder (examples/common)"
      paths:
        - examples/common/**
      statuses:
        - type: project
          target: 95%
          informational: true
        - type: patch
          target: 95%
          informational: true

    # One component per rung, scoped to the rung's DTOs, models and screens
    # (bookmarks) or to its models (bank, lims), each informational with its
    # target at the rung's measured floor: an informational status is a
    # reference line, and a line drawn where coverage is makes a regression
    # legible at once, where an aspirational one would read as noise.
    - component_id: bookmarks
      name: "application ladder rung 1 (examples/bookmarks)"
      paths:
        - examples/bookmarks/**
      statuses:
        - type: project
          target: 86%
          informational: true
        - type: patch
          target: 86%
          informational: true

    # Bank's models. `auto` compares each upload with its base until the
    # rung's first measured floor replaces it.
    - component_id: bank
      name: "application ladder rung 2 (examples/bank models)"
      paths:
        - examples/bank/src/models/**
        - examples/bank/include/bank/models/**
      statuses:
        - type: project
          target: auto
          informational: true
        - type: patch
          target: auto
          informational: true

    - component_id: lims
      name: "application ladder rung 3 (examples/lims models)"
      paths:
        - examples/lims/src/models/**
        - examples/lims/include/lims/models/**
      statuses:
        - type: project
          target: 97%
          informational: true
        - type: patch
          target: 97%
          informational: true

# Always post the coverage-comparison comment on a PR, even on the first upload
# after activation and even when the base report is still processing.
#
# `layout` is a closed vocabulary, and Codecov rejects an unknown entry as a
# validation error for the *whole file* -- a file that fails validation is
# discarded wholesale, so every `status`, `component_management` and `ignore`
# rule below stops applying and Codecov's own defaults (a blocking
# `codecov/patch` at `target: auto`) silently take their place. `reach` is the
# reachability graph; there is no `reference` section, and naming one is what
# had quietly turned this entire config into a no-op (morph#133).
#
# The failure mode is worth naming because it is invisible: nothing errors,
# the checks still run, and the file reads as though it is in force.
comment:
  layout: "reach, diff, flags, files, components"
  behavior: default
  require_base: false
  require_head: true
  require_changes: false

# Nothing in examples/ other than examples/common and the built rungs ever
# gets compiled by the coverage job's configure (MORPH_BUILD_LADDER builds
# examples/common's targets plus each rung named by MORPH_LADDER_RUNGS), so
# forms/concepts/etc. never produce coverage data here in the first
# place; excluding them explicitly documents the intent rather than relying
# on that as an accident of what happens to be built. A rung's own test
# sources are excluded for the same reason examples/common's are: a suite
# scoring its own test code inflates the number it is supposed to police.
ignore:
  - "tests/**"
  - "src/**"
  - "examples/bank/memory/**"
  - "examples/forms/**"
  - "examples/concepts/**"
  - "examples/vetted_hmac/**"
  - "examples/qt_tls_client/**"
  - "examples/common/testkit/test_*.cpp"
  - "examples/common/testkit/testkit_main.cpp"
  # Each rung's own test sources, on the same terms as examples/common's.
  - "examples/bookmarks/tests/**"
  - "examples/bank/tests/**"
  - "examples/bank/screens/tests/**"
  - "examples/lims/tests/**"
