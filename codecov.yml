# Codecov configuration.
#
# Coverage is produced by the `clang-coverage` CI job via scripts/coverage.sh:
# always include/morph (the library), plus examples/common (the ladder's
# hand-written GUI/testkit code — real coverage of morph's own client stack,
# not app-specific logic; see examples/TESTING.md's "round-7 T4 reframe") and
# every built rung's own models/app/presenter code, whenever that leg's
# configure also builds the ladder. Tests, a rung's `main()` shells
# (`gui/`, `gui_wasm/`), demo src/, fetched dependencies, and
# AUTOMOC-generated files (which live under the build tree, never under a
# source-tree path this config names) are excluded.

coverage:
  status:
    # Default (include/morph, i.e. everything not claimed by a component
    # below): informational only, unchanged from before this file started
    # tracking the ladder. This project's own IMPLEMENTATION.md rule 5 has
    # never claimed the whole library is 100% covered — only "models" (and
    # now the ladder's hand-written GUI/testkit code, see the component
    # below) carry that promise. Note that no status in this file blocks
    # today -- see the components below for why the ladder's gates are
    # informational while rungs 5-8 are still being built (morph#133).
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The ladder's hand-written GUI/testkit code is held to the same 100% bar
# examples/IMPLEMENTATION.md rule 5 sets for models (there are no rung
# models yet — rung 0 ships no app — so this component is the whole of that
# promise today; src/models/ and include/<rung>/models/ join it as rungs
# land). Scoped to examples/common specifically, not project-wide: a
# gate over the *entire* codebase is a much bigger, unverified claim this
# repo has never made and this change does not attempt.
#
# The target sat at 98% (not a literal 100%) for a measurement-tooling reason
# rather than an intentional gap, and the reasoning still explains why a
# ladder component can never honestly read 100%: llvm-cov's source-based coverage places a
# "control reached past this block" counter on the closing brace of certain
# blocks (a switch-case's `}` after `break;`, a scope's `}` after its one
# statement calls a `std::function<void()>`), and that counter can read 0
# even though the statement immediately above it — proven by its own hit
# count — ran. There is no llvm-cov equivalent of gcov's inline
# `LCOV_EXCL_LINE` to suppress just those lines. Confirmed present-day
# instances, all in hand-written (non-test) files, each already directly
# exercised by an existing test per llvm-cov's own count on the preceding
# line: backend_rig.hpp's three switch-case closing braces (BackendRig's
# constructor, one per Mode), strand_interleaver.hpp's two post-`task()`
# closing braces (`step()`, `runSchedule()`), and fault_proxy.cpp's one
# integration-unreachable line pair (onClientConnection's null-guard —
# Qt's own newConnection contract guarantees a valid pointer in practice;
# the underlying decision, isValidIncomingConnection, is unit-tested
# directly). Together these put today's real ceiling at 478/485 = 98.56%
# lines — re-measured at rung 1's close, when `examples/common` gained
# `db_busy_fixture.hpp` and `backend_rig.hpp`'s executor-liveness guard. The
# artifact *list* above is unchanged (the same seven lines); only the
# denominator moved. 98% leaves a small margin below that measured ceiling
# rather than sitting exactly on it, while still failing the gate long before
# a real, newly-introduced gap could hide behind this handful of known
# artifacts.
#
# Per-rung components, one per rung, rather than one component spanning the
# whole ladder: each rung's real ceiling is set by its own handful of known
# artifacts, and folding them together would mean re-deriving a single number
# every time a rung lands. A rung's component simply appears when its
# directory does.
component_management:
  individual_components:
    - component_id: ladder
      name: "application ladder (examples/common)"
      paths:
        - examples/common/**
      statuses:
        - type: project
          target: 95%
          informational: true
        - type: patch
          target: 95%
          informational: true

    # Rung 1, pastebin.
    #
    # What is actually measured, precisely — the `paths` glob below is
    # `examples/pastebin/**`, but a component can only score files the
    # uploaded report contains, and that report is whatever
    # `scripts/coverage.sh` names in its `SOURCES` array. For this rung that
    # is `include/`, `src/` and `gui_lib/`: the DTOs, the model and app
    # bootstrap, and the hand-written presenter/QML-adapter layer. It is
    # **not** `gui/` or `gui_wasm/` — those are `main()` shells (engine setup,
    # argv parsing, `setInitialProperties`) with no unit-testable seam,
    # exercised by the offscreen QML engine-load smoke test and by hand, and
    # they are named in `ignore:` below so their absence is a decision rather
    # than an accident. `tests/` is excluded for the same reason
    # examples/common's is: a suite scoring its own test code inflates the
    # number it is supposed to police.
    #
    # Same reasoning as the component above for the target: 96%, not a
    # literal 100%, because of a measured ceiling rather than an intentional
    # gap. Measured with `llvm-cov report` over that denominator:
    # 442/450 lines = 98.22%. Every one of the eight missed lines is
    # accounted for:
    #   * units.hpp (2) — the `default:` arm of `UnitTraits<Unit>::meta`'s
    #     switch. `Unit` has exactly one enumerator, so that arm is
    #     unreachable without undefined behavior; it exists because the
    #     repo's warning policy requires a switch default.
    #   * src/app/app.cpp (4) — `sweepExpiredOnce()`'s `.onError` branch,
    #     which logs an `ExpirePaste` that failed to dispatch. Provoking a
    #     dispatch failure through a `SimulatedRemoteBackend` needs the
    #     fault-injection proxy that lands at rung 4; until then there is no
    #     honest way to reach it.
    #   * src/models/paste_model.cpp (2) — the `rows.empty()` guard in
    #     `execute(GetPaste)`'s read-back, taken when the row vanishes
    #     between an `UPDATE` that just matched it and a `SELECT` in the same
    #     transaction, while that transaction holds the write lock. The
    #     source documents it as unreachable in practice and treats it as
    #     "gone" rather than asserting.
    # `gui_lib/` itself is fully covered: `paste_presenter.cpp`,
    # `paste_qml_bridges.cpp`, `paste_forms_controller.cpp` and both headers'
    # inline bodies are at 100% lines, by `tests/test_paste_presenter.cpp` and
    # `tests/test_paste_qml_bridges.cpp`.
    #
    # 96%, not something nearer the 98.22% ceiling, for two reasons: it leaves
    # a margin below that ceiling rather than sitting on it, and the ceiling
    # is not perfectly stable — `paste_model.cpp` scores 2 or 3 missed lines
    # depending on the run, because the two `DbBusyFixture` store-error cases
    # race a real SQLite lock and which classifier branch they land in is
    # genuinely timing-dependent. A target within a line or two of the ceiling
    # would flake on that alone. 96% still fails long before a real,
    # newly-introduced gap could hide behind these eight lines.
    - component_id: pastebin
      name: "application ladder rung 1 (examples/pastebin)"
      paths:
        - examples/pastebin/**
      statuses:
        - type: project
          target: 95%
          informational: true
        - type: patch
          target: 95%
          informational: true

    # Rungs 2-4, added with morph#141/#142 -- the change that first put them
    # into the coverage report at all. Before it, scripts/coverage.sh named
    # only rung 1, so bookmarks, polls and kanban (~15k lines of models,
    # presenters and QML adapters) contributed nothing to any number and were
    # gated by nothing.
    #
    # Their measured coverage when they entered the report:
    #
    #     ladder (examples/common)   95.85%
    #     pastebin (rung 1)          95.99%
    #     bookmarks (rung 2)         86.79%
    #     polls (rung 3)             85.99%
    #     kanban (rung 4)            85.09%
    #
    # The ~10-point split is not a coincidence: the two components that had a
    # gate watching them sit near 96%, and the three that never did sit near
    # 85%. That is the clearest evidence in this repo that a visible number
    # changes what gets written.
    #
    # Every status here is `informational: true` deliberately. These rungs are
    # below where they should be, and a blocking gate today would stop work on
    # rungs 5-8 to pay down debt from rungs 2-4 -- the wrong order. The
    # decision is: finish building the ladder, then raise these. Informational
    # statuses still post the number on every PR, so the gap stays visible
    # while it is being carried rather than quietly forgotten, and flipping
    # `informational` to `false` later is a one-line change per component once
    # the numbers support it.
    #
    # Targets are set at each rung's measured floor rather than an aspiration:
    # an informational status is a *reference line*, and a line drawn where
    # coverage actually is makes a regression legible immediately. An
    # aspirational target would show every PR as failing-but-ignored, which
    # reads as noise and gets tuned out.
    - component_id: bookmarks
      name: "application ladder rung 2 (examples/bookmarks)"
      paths:
        - examples/bookmarks/**
      statuses:
        - type: project
          target: 86%
          informational: true
        - type: patch
          target: 86%
          informational: true

    - component_id: polls
      name: "application ladder rung 3 (examples/polls)"
      paths:
        - examples/polls/**
      statuses:
        - type: project
          target: 85%
          informational: true
        - type: patch
          target: 85%
          informational: true

    - component_id: kanban
      name: "application ladder rung 4 (examples/kanban)"
      paths:
        - examples/kanban/**
      statuses:
        - type: project
          target: 85%
          informational: true
        - type: patch
          target: 85%
          informational: true

    # Rung 5, ledger. Scoped to the rung's models -- what
    # examples/IMPLEMENTATION.md rule 5's bar actually names -- rather than the
    # whole rung directory, so the number describes domain logic rather than
    # being diluted by presenters and QML adapters that have their own tests.
    #
    # Measured ceiling, from `llvm-cov export`'s JSON (covered/total, not the
    # rounded report percentage) over the full ledger suite:
    #
    #     src/models/ledger_model.cpp            611/688   88.81%
    #     src/models/budget_model.cpp            187/211   88.63%
    #     src/models/rule_model.cpp               69/79    87.34%
    #     include/ledger/models/ledger_model.hpp  15/21    71.43%
    #     include/ledger/models/budget_model.hpp  12/12   100.00%
    #     include/ledger/models/rule_model.hpp     1/1    100.00%
    #     ------------------------------------------------------
    #     total                                  895/1012  88.44%
    #
    # Target 87%, a small margin below that ceiling so an ordinary refactor
    # does not trip it while a real regression does.
    #
    # `informational: true`, deviating from this rung's own plan (Task 25 says
    # `false`). That plan predates the decision recorded in morph#133: every
    # ladder gate is informational until the ladder is built, then raised
    # together. Making rung 5 the single blocking component -- while rungs 2-4
    # sit informational near 85% -- would invert that policy and gate the
    # newest code most strictly precisely because it is newest.
    #
    # Measuring this honestly was worth doing rather than rounding past: the
    # first measurement put rule_model.cpp at 60.76%, which turned out to be
    # two documented obligations nothing verified -- Task 11's empty-principal
    # refusal and Task 11a's self-journaling, both claimed by the rung and
    # neither executed. Covering them moved the file to 87.34% and the
    # component from 86.36% to 88.44%.
    - component_id: ledger
      name: "application ladder rung 5 (examples/ledger models)"
      paths:
        - examples/ledger/src/models/**
        - examples/ledger/include/ledger/models/**
      statuses:
        - type: project
          target: 87%
          informational: true
        - type: patch
          target: 87%
          informational: true

    # Rung 6, lims. Scoped to the rung's models, like ledger's above and for
    # the same reason: the number then describes domain logic rather than
    # being diluted by presenters and QML adapters that have their own suites.
    #
    # NOTE: neither this component nor ledger's could score anything until
    # rung 6 also fixed scripts/coverage.sh, whose hand-copied rung list had
    # drifted from CMake's and named only rungs 1-4. ledger's component was
    # matching a set of files no uploaded report contained -- silently
    # reporting nothing rather than failing. Fixed by rung 6, and structurally
    # closed by morph#179: coverage.sh now reads examples/rungs.txt (the single
    # authoritative rung list) instead of restating it.
    #
    # The components in this file are the other half of that pair, and are the
    # one thing here that still has to be written by hand -- Codecov reads this
    # file on its own service, so nothing in the repository can generate it.
    # scripts/check_rung_filters.sh therefore fails the build if any rung in
    # examples/rungs.txt has no `component_id` here.
    #
    # Measured ceiling, from `llvm-cov export`'s JSON (covered/total, not the
    # rounded report percentage) over the full lims suite:
    #
    #     src/models/sample_model.cpp             666/671   99.25%
    #     src/models/analysis_catalog_model.cpp   182/186   97.85%
    #     include/lims/models/sample_model.hpp      7/7    100.00%
    #     -------------------------------------------------------
    #     total                                   855/864   98.96%
    #
    # The remaining misses are three defensive guards, each unreachable
    # through the model's own API rather than merely untested:
    #   * sample_model.cpp, `alreadyDecided`'s empty-key guard --
    #     `QueuedCapture::validate()` refuses an empty `operationKey` before
    #     any dispatch path reaches the lookup, so the guard only fires for a
    #     caller that bypassed validation entirely.
    #   * analysis_catalog_model.cpp, `renderSchemaFor`'s "not JSON we can
    #     patch" arm -- the input is `morph::forms::schemaJson<A>()`, which
    #     either produces valid JSON or an empty string; there is no input a
    #     caller can supply.
    #   * analysis_catalog_model.cpp, `GetAnalysisVersion`'s "version's
    #     analysis is missing" arm -- `lims_analysis_versions.analysis_id` is
    #     a declared foreign key, so a version row with no analysis row cannot
    #     exist while the constraint is enforced.
    # Each is kept rather than deleted because each turns an impossible state
    # into a typed error instead of a dereference; none is reachable by a test
    # that does not first disable the very thing making it impossible.
    #
    # Target 97%, a margin below the 98.96% ceiling so an ordinary refactor
    # does not trip it while a real regression does. `informational: true`,
    # consistent with every other ladder component (morph#133): the ladder's
    # gates are raised together once it is built, not one rung at a time with
    # the newest code gated most strictly.
    #
    # Measuring this honestly was worth doing rather than rounding past, twice
    # over. The first measurement came in at 93.27%, and the gap was not
    # padding: it included `AnalysisCatalogModel::attachActionLog`, never
    # called by any test, so the catalogue's whole journaling path was
    # unverified -- and the audit trail's own classifier, whose
    # `VerifyResult` branch was dead because verifications were being
    # journaled under an *empty* entity key. That second one was a real
    # defect, not a coverage artifact: a sample's audit trail silently omitted
    # the second pair of eyes. Fixed by rekeying the journal to the result's
    # own sample, and pinned by a test.
    - component_id: lims
      name: "application ladder rung 6 (examples/lims models)"
      paths:
        - examples/lims/src/models/**
        - examples/lims/include/lims/models/**
      statuses:
        - type: project
          target: 97%
          informational: true
        - type: patch
          target: 97%
          informational: true

# Always post the coverage-comparison comment on a PR, even on the first upload
# after activation and even when the base report is still processing.
#
# `layout` is a closed vocabulary, and Codecov rejects an unknown entry as a
# validation error for the *whole file* -- a file that fails validation is
# discarded wholesale, so every `status`, `component_management` and `ignore`
# rule below stops applying and Codecov's own defaults (a blocking
# `codecov/patch` at `target: auto`) silently take their place. `reach` is the
# reachability graph; there is no `reference` section, and naming one is what
# had quietly turned this entire config into a no-op (morph#133).
#
# The failure mode is worth naming because it is invisible: nothing errors,
# the checks still run, and the file reads as though it is in force.
comment:
  layout: "reach, diff, flags, files, components"
  behavior: default
  require_base: false
  require_head: true
  require_changes: false

# Nothing in examples/ other than examples/common and the built rungs ever
# gets compiled by the coverage job's configure (MORPH_BUILD_LADDER builds
# examples/common's targets plus each rung named by MORPH_LADDER_RUNGS and,
# under Emscripten only, wasm_spike — which this job never reaches), so
# bank/forms/concepts/etc. never produce coverage data here in the first
# place; excluding them explicitly documents the intent rather than relying
# on that as an accident of what happens to be built. A rung's own test
# sources are excluded for the same reason examples/common's are: a suite
# scoring its own test code inflates the number it is supposed to police.
ignore:
  - "tests/**"
  - "src/**"
  - "examples/bank/**"
  - "examples/forms/**"
  - "examples/concepts/**"
  - "examples/vetted_hmac/**"
  - "examples/qt_tls_client/**"
  - "examples/common/testkit/test_*.cpp"
  - "examples/common/testkit/testkit_main.cpp"
  - "examples/common/wasm_spike/**"
  - "examples/pastebin/tests/**"
  - "examples/pastebin/gui/**"
  - "examples/pastebin/gui_wasm/**"
  # Rungs 2-4, on exactly the same terms as rung 1 above: a rung's own test
  # sources are excluded so the suite does not score itself, and `gui/` +
  # `gui_wasm/` are `main()` shells with no unit-testable seam. These entries
  # arrive with morph#141, which is what first put these rungs into the
  # coverage report at all -- scripts/coverage.sh had only ever named rung 1.
  - "examples/bookmarks/tests/**"
  - "examples/bookmarks/gui/**"
  - "examples/bookmarks/gui_wasm/**"
  - "examples/polls/tests/**"
  - "examples/polls/gui/**"
  - "examples/polls/gui_wasm/**"
  - "examples/kanban/tests/**"
  - "examples/kanban/gui/**"
  - "examples/kanban/gui_wasm/**"
  # Rungs 5-6, on the same terms. Both entered the coverage report for the
  # first time with rung 6's fix to scripts/coverage.sh.
  - "examples/ledger/tests/**"
  - "examples/ledger/gui/**"
  - "examples/ledger/gui_wasm/**"
  - "examples/lims/tests/**"
  - "examples/lims/gui/**"
  - "examples/lims/gui_wasm/**"
