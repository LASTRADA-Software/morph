name: Drift guard

# Gates for the "a list that stopped matching what it describes" class of bug.
# Every job here is fast and dependency-free; none of them compiles anything.
#
# It also carries one gate for the neighbouring "a suppression that suppresses
# nothing" class (the NOLINT-directive scan at the end of prose-lint, #627),
# which is the same shape of defect one level down: a control that parses, looks
# applied, and measures nothing.
#
# And one for the class below that again: a character that is not there to be
# read at all (the raw-bidi-control scan, #628). Same family -- a file that
# looks correct to every reader while saying something else -- which is why it
# rides prose-lint alongside the NOLINT scan rather than living elsewhere.
#
# Sections below: the spec <-> code gates, the NOLINT-directive gate and the
# raw-bidi-control gate, the ladder rung-list gate, then the scenario-coverage
# gate.
#
# Two independent gates for the "spec <-> code drift" class of bug (a
# docs/spec/*.md file stating a mechanical fact -- an enum cardinality, a
# constant, a canonical error string, a glaze parsing flag -- that silently
# stops matching the code):
#
#   1. The compiled pinned-facts test (tests/test_pinned_facts.cpp) needs no
#      job here: it is already part of the `morph_tests` target, so it runs
#      in every job of the main CI workflow (.github/workflows/ci.yml) for
#      free, and benefits from running under every compiler in that matrix
#      (GCC, Clang, MSVC, clang-cl) since the enum-cardinality switch pins
#      (see tests/test_pinned_facts.cpp) rely on compiler-specific warning
#      behavior that is worth exercising on all of them, not just one.
#   2. The prose-vs-manifest lint (scripts/check_spec_citations.sh) is a
#      repo-wide text scan, unrelated to compilation -- it runs here, in its
#      own fast, dependency-free job, alongside the CI-clang-pin lint
#      (scripts/check_ci_clang_pin.sh, morph#457), which is the same shape of
#      scan against a different source of truth: ci.yml's own CLANG_VERSION.
#
# Unlike .github/workflows/spec-sync.yml, this gate has no "no docs update"
# label escape hatch: a wrong citation or a reintroduced banned term is never
# a legitimate state to merge, so there is nothing to opt out of.

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede a run a newer commit on the same ref has made obsolete -- see the
# note in ci.yml. Cheap here, but the queue it shares is account-wide.
concurrency:
  group: drift-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A sanitizer leg that cannot fail is worse than no sanitizer leg: it reports
  # success over a build full of undefined behaviour and every reader treats the
  # green tick as evidence (morph#541). UBSan *recovers* by default -- it prints
  # the diagnostic and lets the process exit 0 -- so this asserts the opposite
  # behaviourally, by compiling real undefined behaviour with the flags
  # apply_sanitizers() actually produces and requiring a non-zero exit.
  #
  # Behavioural rather than a grep for the flag, for the reason morph#298
  # established: a flag that silently stops reaching the compile line is
  # indistinguishable from one that was never needed.
  sanitizer-can-fail:
    name: A sanitizer leg can actually fail
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert UBSan halts instead of recovering
        run: bash scripts/check_sanitizer_can_fail.sh

  dep-cache-selftest:
    name: Dependency-cache self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A dependency cache that silently stops caching is indistinguishable
      # from a working one -- the build still succeeds, it just clones again --
      # so the four properties cmake/DepCache.cmake promises are asserted
      # rather than assumed (morph#552). The first version of the helper used
      # `CMakeLists.txt` as its validity marker, which a stylesheet repository
      # does not have; this self-test is what caught it.
      - name: Self-test the FetchContent dependency cache
        run: bash scripts/test_dep_cache.sh

  prose-lint:
    name: Spec-citation, banned-terminology & CI-clang-pin lint
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 for the spec-sync self-test at the end of this job:
      # morph#560's two acceptance cases are named commits (9445bc04 and
      # a72787ed), and under the default depth-1 checkout the self-test skips
      # them rather than running them -- which would leave the one case that
      # reproduces the reported defect never actually exercised in CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same terms as rung-filter-lint below, and ci.yml's deprecation-lint and
      # test-type-name-lint: a lint gate nobody tests reports green whether or
      # not it still detects anything. The section-citation check (morph#316)
      # exists because this very script carried a check that could not fail, so
      # it is asserted to still fail before it is trusted to pass.
      - name: Self-test the spec-citation checker
        run: bash scripts/test_check_spec_citations.sh

      - name: Run prose-vs-manifest lint
        run: bash scripts/check_spec_citations.sh

      # scripts/check_ci_clang_pin.sh, on the same terms and in the same job:
      # it is another repo-wide text scan that compiles nothing, and the drift
      # it catches is the same family -- a mechanical fact stated in prose that
      # silently stopped matching the thing it describes.
      #
      # Its own history (morph#457) is the argument for the self-test running
      # first. ci.yml's CLANG_VERSION moved 20 -> 22 on 2026-07-19 and six
      # places went on asserting 20, including docs/spec/testing_charter.md,
      # which is a spec and therefore the document a reader is told to trust.
      # The stale fact was load-bearing: it was the largest stated obstacle to
      # moving the mutation campaign into CI (morph#408), and it did not exist.
      # Nothing returned nonzero for a month, because a sentence about a
      # compiler version keeps compiling after the version changes -- and a
      # gate that had gone blind to it would look exactly like the tree being
      # correct, which it is today.
      - name: Self-test the CI-clang-pin checker
        run: bash scripts/test_check_ci_clang_pin.sh

      - name: Check every stated CI clang pin matches ci.yml
        run: bash scripts/check_ci_clang_pin.sh

      # ── Catch2 test names that are read as a filter expression (#466) ──
      # Another text-only scan, so it rides this job rather than paying for a
      # runner of its own. catch_discover_tests hands each test's own name
      # back to the binary as the Catch2 *filter* argument, and Catch2 parses
      # that as a test spec: a name beginning with `~` (or `exclude:`) is a
      # negation, so its ctest entry runs every OTHER test in the binary,
      # never its own, and exits 0 reporting "All tests passed". Verified on
      # ladder_pastebin_tests: 56 of 57 cases ran, exit 0.
      #
      # Same reasoning as every other gate in this file, and the defect is
      # again a silence -- an unusually complete one, since the test, the
      # ctest entry and the run all look correct. It has already cost real
      # work once (morph#391's `~App ...` guard tests ran 16 unrelated cases
      # and reported green), and no name on master triggers it today, so this
      # gate exists to keep the trap unrepresentable rather than to fix a
      # live break. Self-tested first, for the usual reason.
      - name: Self-test the Catch2 test-name checker
        run: bash scripts/test_check_catch_test_names.sh

      # ── The header <-> spec sync gate's own rule (#560) ──────────────────
      # The gate runs in .github/workflows/spec-sync.yml, on a pull_request
      # merge ref; its *rule* is scripts/check_spec_sync.sh, and a rule that is
      # only ever exercised on the event it gates is one nobody has seen go
      # red. It had not: include/morph/net/** was missing from its sub-domain
      # list, so an interop-visible WebSocket behaviour change shipped with no
      # documentation past a green tick (9445bc04). This drives the rule
      # against that commit and against the one that documented it, plus every
      # rejection and acceptance it claims -- here, where it costs a few
      # seconds and no compilation.
      - name: Self-test the header/spec sync gate
        run: bash scripts/test_check_spec_sync.sh

      - name: Check every test name selects itself as a Catch2 filter
        run: bash scripts/check_catch_test_names.sh

      # ── NOLINT directives that cannot take effect (#627, folded here by #633) ──
      # NOLINTNEXTLINE applies to the next *physical* line. When the reason is
      # wrapped onto a second comment line, the directive annotates that
      # comment, the findings it names are still reported, and clang-tidy says
      # nothing about it -- the directive parses and the file looks annotated.
      # Four such directives existed on master and six findings leaked past
      # three of them (#627).
      #
      # That is the failure mode AGENTS.md names first -- a control that
      # reports success while measuring nothing -- one level below the gate. It
      # also matters for the clang-tidy campaign in #580, whose agreed remedy
      # is partly "write an individually reasoned NOLINT": that campaign cannot
      # proceed honestly on a tree where NOLINTs silently fail to apply, so
      # this gate is its precondition.
      #
      # A fast, dependency-free text scan over ~700 source files that compiles
      # nothing, so it rides this job for the same reason the CI-clang-pin and
      # Catch2-name scans above do, rather than paying for a runner of its own.
      # It landed as a workflow of its own only because this file was held by
      # an open PR at the time (#614); that PR has landed and #633 folds it in.
      #
      # The scan leaves a deliberate residual: an anchoring `NOLINTNEXTLINE`
      # whose own line carries no finding is accepted, because a directive may
      # legitimately annotate a line the current check set says nothing about.
      # The self-test below pins that, and it is the reason this gate is not a
      # blanket "every directive must suppress something".
      #
      # Self-test first, as every other lint in this repository does: a gate
      # that detects nothing reports the same green as a clean tree, and for
      # this gate that would be the very defect it exists to catch, one level
      # up. It drives the checker against tests/lint/nolint_directives/ -- the
      # two effective shapes must be accepted, each inert shape rejected on its
      # own and naming its own file, and a directory with no directives at all
      # rejected rather than called clean.
      - name: Self-test the NOLINT-directive checker
        run: bash scripts/test_check_nolint_directives.sh

      - name: Check every NOLINTNEXTLINE annotates a line of code
        run: bash scripts/check_nolint_directives.sh

      # ── Raw bidi control characters in first-party files (#628) ───────────
      # A bidirectional control renders as nothing and occupies no column, so a
      # diff containing one looks exactly like a diff that does not. In a
      # string literal that is a silently wrong assertion (#610's subject: nine
      # lines of src/qt/forms/tests/tst_i18n.qml whose expected values held raw
      # U+200E / U+200F / U+061C). In a comment it is source that stops saying
      # what it means -- #628 reproduced that on itself, typing the six
      # characters of a U+061C escape through a JSON-payload tool that
      # decoded it before the file was written, twice, in two files. This
      # very comment made it a fourth time, and the gate below caught it
      # before the branch was pushed. Between them lies the trojan-source
      # shape, where an override or isolate makes a line render as a different
      # program from the one that compiles.
      #
      # Review is not a control for this class, and that is the argument for a
      # gate rather than a habit: #610 itself asked for this lint and deferred
      # it, and the PR that closed #610 was reviewed by people who could not
      # have seen a raw control had one survived, because the diff renders them
      # as nothing.
      #
      # A fast, dependency-free text scan over every tracked file that compiles
      # nothing, so it rides this job for the same reason the NOLINT-directive,
      # CI-clang-pin and Catch2-name scans above do.
      #
      # This one ships already green -- 0 raw controls across 1244 tracked
      # files -- which makes the self-test the whole of its evidence rather
      # than a formality. "0 occurrences found" is exactly what a broken
      # detector prints, so the checker probes its own detector against every
      # declared codepoint before opening a file, treats a scan of zero files
      # as a failure, and the self-test below holds its own independent list of
      # the twelve and requires each to be found in tests/lint/bidi_controls/ --
      # which is what notices a codepoint being deleted from the checker's
      # table, something the checker's own probe cannot see.
      - name: Self-test the raw-bidi-control checker
        run: bash scripts/test_check_bidi_controls.sh

      - name: Check no first-party file carries a raw bidi control
        run: python3 scripts/check_bidi_controls.py

  # ── Ladder rung list <-> the CI filters that are supposed to track it ──
  # examples/rungs.txt is the ladder's single authoritative rung list, and
  # almost every consumer now derives from it at run time. Three cannot --
  # wasm-ladder.yml's `on.*.paths` (GitHub reads them before any step exists to
  # generate them), codecov.yml (read by Codecov, not by us), and each rung's
  # tests/.clang-tidy (clang-tidy walks up from the file it analyses, so a
  # per-directory setting can only live in that directory) -- so they are
  # checked against it here.
  #
  # This job has no path filter, deliberately. The bug it guards against
  # (morph#179) was a path filter that had gone stale; gating the guard on one
  # would reproduce the failure mode it exists to catch.
  rung-filter-lint:
    name: Ladder rung list vs. CI path filters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The gate itself is tested first, on the same terms as ci.yml's
      # deprecation-lint and test-type-name-lint jobs: a lint gate nobody tests
      # reports green whether or not it still detects anything -- and a filter
      # that detected nothing is precisely the defect this gate exists for.
      - name: Self-test the rung-filter checker
        run: bash scripts/test_check_rung_filters.sh

      - name: Check every known rung appears in the filters that cannot generate it
        run: bash scripts/check_rung_filters.sh

  # ── The AUTOMOC-include gate's own self-test ───────────────────────────
  # The gate itself (scripts/check_automoc_includes.sh) cannot run here: it
  # reads generated moc output, so it needs an AUTOMOC target to have been
  # built, and it runs after the build in ci.yml's linux-qt, ladder-tests and
  # linux-all-features jobs. Its self-test needs no Qt, no toolchain and no
  # build at all, so it runs here, once, in seconds -- and, unlike a step
  # behind a 20-minute build, it still reports when that build fails.
  #
  # Same reasoning as every other gate in this file: a lint gate nobody tests
  # reports green whether or not it still detects anything. This one is
  # especially exposed to that, because the ascending include it looks for
  # (issue #372) is present in every build and only becomes a compile error
  # where the directory arithmetic lands on a second same-named header -- so
  # the gate going blind would look exactly like the gate passing.
  automoc-include-lint:
    name: AUTOMOC-include checker self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the AUTOMOC-include checker
        run: bash scripts/test_check_automoc_includes.sh

  # ── The duplicate-ctest-name gate's own self-test ──────────────────────
  # The gate itself (scripts/check_ctest_name_collisions.sh) runs after the
  # build in ci.yml's ladder-tests job, because it asks ctest what it would
  # run and so needs a configured, test-registered tree. Its self-test needs
  # none of that -- it feeds the checker hand-written
  # `ctest --show-only=json-v1` documents, plus one throwaway two-directory
  # CMake project -- so it runs here, in seconds, and still reports when that
  # build fails.
  #
  # Same reasoning as every other gate in this file: the defect is a silence.
  # A ctest name is global to the build tree, so two rung test binaries
  # sharing a TEST_CASE name produce two entries that every by-name operation
  # addresses at once -- and `set_tests_properties` APPENDS labels, so one
  # entry accumulated the other rung's label and `ctest -L ladder-<rung>` ran
  # another rung's binary alongside its own (morph#464: crm reported on 180
  # cases while owning 168). A label filter that selects the wrong set reports
  # green exactly as loudly as one that selects the right one.
  ctest-name-collision-lint:
    name: Duplicate-ctest-name checker self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the duplicate-ctest-name checker
        run: bash scripts/test_check_ctest_name_collisions.sh

  # ── The mutation gates: a self-test (morph#408) and a citation gate (morph#608) ──
  #
  # scripts/check_mutation_regression.py is the gate .github/workflows/mutation.yml
  # runs after scripts/mutation.sh, on a schedule rather than per-PR (that
  # decision, and why a per-PR gate was rejected, is recorded on the issue).
  # It needs neither a build nor Mull itself -- both its inputs are files (an
  # IDE-format Mull report and a JSON baseline), so its self-test runs here in
  # seconds with hand-written fixtures, exactly like every other checker in
  # this file.
  #
  # docs/spec/testing_charter.md names the defect this closes in its own
  # words: "Mutation score has no floor... A regression would have to be
  # noticed by someone re-running the campaign and comparing by hand." A gate
  # that had silently stopped detecting a regression -- reading "more
  # survivors than the baseline" as clean, or reading zero mutants (a
  # scope-mismatch bug scripts/mutation.sh's own header warns about) as a
  # successful run -- would be indistinguishable from a healthy one without
  # this self-test.
  mutation-regression-lint:
    name: Mutation gates (regression self-test, survivor citations)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the mutation-regression checker
        run: python3 scripts/check_mutation_regression.py --self-test

      # scripts/check_mutation_survivors.py, and unlike everything else in this
      # file this one is the *gate itself*, not only its self-test. It reads no
      # coverage data and no Mull report -- its inputs are
      # scripts/mutation_survivors.json and the headers in the tree -- so there
      # is nothing to defer it to a build leg or to the scheduled campaign for.
      #
      # It belongs per-PR precisely because what it audits rots per-PR. The
      # triage record cites each equivalent mutant by `{file, line, source}`,
      # and an ordinary edit anywhere above one of those lines moves it. By the
      # time morph#608 measured, 5 of the 7 entries pointed at the wrong line
      # and include/morph/core/backend.hpp's was off by 479 -- landing in the
      # middle of an unrelated function, for a reader the mutation gate's own
      # failure message had sent there. Nothing failed, because nothing looked:
      # check_mutation_regression.py compares survivor *counts* against
      # scripts/mutation_baseline.json and never opens the triage file at all.
      #
      # The resolution is check_branch_coverage.py's
      # resolve_allowlist_source_line(), shared rather than reimplemented --
      # scripts/branch_partial_allowlist.json and
      # scripts/error_path_allowlist.json are hardened by that same function,
      # against the same defect found three times over (morph#349, morph#355,
      # morph#419).
      - name: Audit the mutation-survivor citations
        run: python3 scripts/check_mutation_survivors.py

      - name: Self-test the mutation-survivor citation gate
        run: python3 scripts/check_mutation_survivors.py --self-test

  # ── The coverage-object gate's own self-test ───────────────────────────
  # The gate itself (scripts/check_coverage_objects.sh) runs inside
  # scripts/coverage.sh, in ci.yml's linux-coverage job, because it compares the
  # generated manifest against `ctest --show-only=json-v1` and so needs a
  # configured, built, test-registered tree. Its self-test needs none of that --
  # both of its inputs are files, and the fixtures are throwaway executables in
  # a temp directory -- so it runs here, in seconds, and still reports when that
  # 20-minute build fails.
  #
  # Same reasoning as every other gate in this file, and unusually direct here:
  # the defect this gate catches (morph#403 -- a test binary that runs, writes
  # profile data, and is never handed to llvm-cov) is *already* a silence. The
  # coverage run succeeds, the report uploads, and the figure is simply computed
  # over a smaller denominator. A gate that had gone blind to that would be
  # indistinguishable from a gate finding nothing wrong, which is precisely how
  # the same defect reached its third occurrence (morph#141, morph#179, #403).
  coverage-object-lint:
    name: Coverage-object checker self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the coverage-object checker
        run: bash scripts/test_check_coverage_objects.sh

      # scripts/check_coverage_profiles.sh, on the same terms: the gate itself
      # runs inside scripts/coverage.sh, first, before the object-manifest
      # check above -- it only lists build-dir-shaped directory contents, so
      # its self-test needs no build either.
      #
      # Its defect is also a silence, in the flattering direction rather than
      # the shrinking one this job's other two guard against: an unbounded,
      # recursive `find` picked up 2,445 stale .profraw files left by prior
      # runs, with nothing that ever deleted them, and folded their counts
      # into the current report as if they belonged to it (morph#430). A gate
      # that had gone blind to an empty profile set would report exactly the
      # same green this one does when a real run's data is present.
      - name: Self-test the coverage-profiles checker
        run: bash scripts/test_check_coverage_profiles.sh

      # scripts/check_coverage_roots.sh, on the same terms: the gate itself runs
      # inside scripts/coverage.sh (it needs the built objects and the merged
      # profile), and its self-test reads hand-written `llvm-cov export
      # -summary-only` documents, so it needs neither.
      #
      # Its defect is a silence too, and a wider one. A shared compiler cache
      # served objects built in another worktree; clang had embedded that
      # worktree's absolute paths in their coverage mappings; coverage.sh
      # filters by relative path, so those records matched nothing and were
      # dropped -- 246 of 688 in the run that found it, and with them the whole
      # of examples/crm/src/models, whose tests ran and passed throughout
      # (morph#426). Nothing in the pipeline returned nonzero.
      - name: Self-test the coverage-roots checker
        run: bash scripts/test_check_coverage_roots.sh

      # scripts/check_branch_coverage.py, on the same terms: the gate itself
      # runs inside scripts/coverage.sh (it reads the aggregated LCOV that leg
      # produces), and its self-test needs only hand-written fixtures.
      #
      # This one guards a defect with no other trace at all. A branch taken one
      # way only executes its line, so the line percentage is unmoved, Codecov
      # is content, and nothing anywhere reports it -- there are 179 such lines
      # in include/morph today (morph#404). A gate that had gone blind to that
      # would produce exactly the output a healthy one produces.
      - name: Self-test the branch-coverage checker
        run: python3 scripts/check_branch_coverage.py --self-test

      # scripts/check_error_path_coverage.py, on the same terms: it also reads
      # the aggregated LCOV scripts/coverage.sh produces, and its self-test
      # needs only hand-written fixture headers and a hand-written LCOV
      # fragment.
      #
      # This one measures a question no other instrument in the repository
      # answers: not "was this line executed" but "did a test drive this
      # specific throw statement or catch arm" (morph#406). Line coverage
      # cannot tell the difference between a throw that ran because a test
      # exercised the failure and one that ran only because the happy path
      # passes through it; a catch arm that swallows the wrong thing changes
      # nothing an ordinary assertion observes. morph#347 and morph#348 were
      # both exactly that shape, both in include/morph/core, both live in
      # production before anyone noticed.
      - name: Self-test the error-path coverage checker
        run: python3 scripts/check_error_path_coverage.py --self-test

  # ── The wire/action surface <-> the scenario corpus that covers it ──────
  # scripts/scenario/scenario_coverage.py enumerates two surfaces straight out
  # of the source -- every envelope kind and refusal RemoteServer can put on
  # the wire (include/morph/core/remote.hpp, wire.hpp), and every action each
  # server rung registers (BRIDGE_REGISTER_ACTION under examples/<rung>/) --
  # and diffs both against what scripts/scenario/scenarios/ actually sends and
  # asserts. It compiles nothing and starts nothing, which is what lets it run
  # here rather than in the build matrix.
  #
  # The drift it catches is the ordinary kind: a new action registered with no
  # scenario reaching it, a new refusal added to remote.hpp that nothing
  # asserts, an allowlist entry left behind after the thing it exempted became
  # coverable (audited in both directions, so a stale entry fails too), or a
  # scenario edited until it no longer qualifies as a workflow. Every one of
  # those leaves the corpus quietly measuring less than it did, which is
  # exactly the failure mode the report was built for and the reason it is
  # worth a gate rather than a habit.
  #
  # What this job does NOT do is *run* the corpus: that needs the five
  # ladder_<rung>_server binaries built, which is a build this workflow does
  # not have and would stop being fast and dependency-free to acquire. That run
  # lives in ci.yml's `ladder-tests` job, which already builds every one of
  # those binaries -- see its "Run the scenario corpus against the built
  # servers" step (morph#462). The two are complementary and neither replaces
  # the other: this job sees a surface nothing covers, that one sees a covered
  # surface a real server refuses.
  #
  # No path filter, on the same reasoning as rung-filter-lint above: the
  # surface this tracks is spread across include/, examples/ and
  # scripts/scenario/, and a filter that missed one of them would reproduce the
  # drift it exists to catch.
  scenario-coverage:
    name: Wire & action surface vs. the scenario corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The gate itself is tested first, on the same terms as prose-lint and
      # rung-filter-lint above: a lint gate nobody tests reports green whether
      # or not it still detects anything. This self-test drives
      # scenario_coverage.py against fixtures whose right answers are known --
      # including one where the correct exit code is non-zero -- and pins the
      # real corpus's own exit code, so a change that silently stops the
      # shipped scenarios covering their own surface fails here.
      #
      # Standard library only, and no server: scripts/scenario/README.md's
      # "Self-test" section states the same.
      - name: Self-test the scenario runner and the coverage report
        run: python3 scripts/scenario/test_morph_scenario.py

      - name: Check every envelope kind, refusal and registered action is covered or exempt
        run: python3 scripts/scenario/scenario_coverage.py
