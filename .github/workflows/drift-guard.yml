name: Drift guard

# Gates for the "a list that stopped matching what it describes" class of bug.
# Every job here is fast and dependency-free; none of them compiles anything.
#
# Sections below: the spec <-> code gates, the ladder rung-list gate, then the
# scenario-coverage gate.
#
# Two independent gates for the "spec <-> code drift" class of bug (a
# docs/spec/*.md file stating a mechanical fact -- an enum cardinality, a
# constant, a canonical error string, a glaze parsing flag -- that silently
# stops matching the code):
#
#   1. The compiled pinned-facts test (tests/test_pinned_facts.cpp) needs no
#      job here: it is already part of the `morph_tests` target, so it runs
#      in every job of the main CI workflow (.github/workflows/ci.yml) for
#      free, and benefits from running under every compiler in that matrix
#      (GCC, Clang, MSVC, clang-cl) since the enum-cardinality switch pins
#      (see tests/test_pinned_facts.cpp) rely on compiler-specific warning
#      behavior that is worth exercising on all of them, not just one.
#   2. The prose-vs-manifest lint (scripts/check_spec_citations.sh) is a
#      repo-wide text scan, unrelated to compilation -- it runs here, in its
#      own fast, dependency-free job, alongside the CI-clang-pin lint
#      (scripts/check_ci_clang_pin.sh, morph#457), which is the same shape of
#      scan against a different source of truth: ci.yml's own CLANG_VERSION.
#
# Unlike .github/workflows/spec-sync.yml, this gate has no "no docs update"
# label escape hatch: a wrong citation or a reintroduced banned term is never
# a legitimate state to merge, so there is nothing to opt out of.

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede a run a newer commit on the same ref has made obsolete -- see the
# note in ci.yml. Cheap here, but the queue it shares is account-wide.
concurrency:
  group: drift-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prose-lint:
    name: Spec-citation, banned-terminology & CI-clang-pin lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same terms as rung-filter-lint below, and ci.yml's deprecation-lint and
      # test-type-name-lint: a lint gate nobody tests reports green whether or
      # not it still detects anything. The section-citation check (morph#316)
      # exists because this very script carried a check that could not fail, so
      # it is asserted to still fail before it is trusted to pass.
      - name: Self-test the spec-citation checker
        run: bash scripts/test_check_spec_citations.sh

      - name: Run prose-vs-manifest lint
        run: bash scripts/check_spec_citations.sh

      # scripts/check_ci_clang_pin.sh, on the same terms and in the same job:
      # it is another repo-wide text scan that compiles nothing, and the drift
      # it catches is the same family -- a mechanical fact stated in prose that
      # silently stopped matching the thing it describes.
      #
      # Its own history (morph#457) is the argument for the self-test running
      # first. ci.yml's CLANG_VERSION moved 20 -> 22 on 2026-07-19 and six
      # places went on asserting 20, including docs/spec/testing_charter.md,
      # which is a spec and therefore the document a reader is told to trust.
      # The stale fact was load-bearing: it was the largest stated obstacle to
      # moving the mutation campaign into CI (morph#408), and it did not exist.
      # Nothing returned nonzero for a month, because a sentence about a
      # compiler version keeps compiling after the version changes -- and a
      # gate that had gone blind to it would look exactly like the tree being
      # correct, which it is today.
      - name: Self-test the CI-clang-pin checker
        run: bash scripts/test_check_ci_clang_pin.sh

      - name: Check every stated CI clang pin matches ci.yml
        run: bash scripts/check_ci_clang_pin.sh

  # ── Ladder rung list <-> the CI filters that are supposed to track it ──
  # examples/rungs.txt is the ladder's single authoritative rung list, and
  # almost every consumer now derives from it at run time. Two cannot --
  # wasm-ladder.yml's `on.*.paths` (GitHub reads them before any step exists to
  # generate them) and codecov.yml (read by Codecov, not by us) -- so they are
  # checked against it here.
  #
  # This job has no path filter, deliberately. The bug it guards against
  # (morph#179) was a path filter that had gone stale; gating the guard on one
  # would reproduce the failure mode it exists to catch.
  rung-filter-lint:
    name: Ladder rung list vs. CI path filters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The gate itself is tested first, on the same terms as ci.yml's
      # deprecation-lint and test-type-name-lint jobs: a lint gate nobody tests
      # reports green whether or not it still detects anything -- and a filter
      # that detected nothing is precisely the defect this gate exists for.
      - name: Self-test the rung-filter checker
        run: bash scripts/test_check_rung_filters.sh

      - name: Check every known rung appears in the filters that cannot generate it
        run: bash scripts/check_rung_filters.sh

  # ── The AUTOMOC-include gate's own self-test ───────────────────────────
  # The gate itself (scripts/check_automoc_includes.sh) cannot run here: it
  # reads generated moc output, so it needs an AUTOMOC target to have been
  # built, and it runs after the build in ci.yml's linux-qt, ladder-tests and
  # linux-all-features jobs. Its self-test needs no Qt, no toolchain and no
  # build at all, so it runs here, once, in seconds -- and, unlike a step
  # behind a 20-minute build, it still reports when that build fails.
  #
  # Same reasoning as every other gate in this file: a lint gate nobody tests
  # reports green whether or not it still detects anything. This one is
  # especially exposed to that, because the ascending include it looks for
  # (issue #372) is present in every build and only becomes a compile error
  # where the directory arithmetic lands on a second same-named header -- so
  # the gate going blind would look exactly like the gate passing.
  automoc-include-lint:
    name: AUTOMOC-include checker self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the AUTOMOC-include checker
        run: bash scripts/test_check_automoc_includes.sh

  # ── The coverage-object gate's own self-test ───────────────────────────
  # The gate itself (scripts/check_coverage_objects.sh) runs inside
  # scripts/coverage.sh, in ci.yml's linux-coverage job, because it compares the
  # generated manifest against `ctest --show-only=json-v1` and so needs a
  # configured, built, test-registered tree. Its self-test needs none of that --
  # both of its inputs are files, and the fixtures are throwaway executables in
  # a temp directory -- so it runs here, in seconds, and still reports when that
  # 20-minute build fails.
  #
  # Same reasoning as every other gate in this file, and unusually direct here:
  # the defect this gate catches (morph#403 -- a test binary that runs, writes
  # profile data, and is never handed to llvm-cov) is *already* a silence. The
  # coverage run succeeds, the report uploads, and the figure is simply computed
  # over a smaller denominator. A gate that had gone blind to that would be
  # indistinguishable from a gate finding nothing wrong, which is precisely how
  # the same defect reached its third occurrence (morph#141, morph#179, #403).
  coverage-object-lint:
    name: Coverage-object checker self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the coverage-object checker
        run: bash scripts/test_check_coverage_objects.sh

      # scripts/check_coverage_profiles.sh, on the same terms: the gate itself
      # runs inside scripts/coverage.sh, first, before the object-manifest
      # check above -- it only lists build-dir-shaped directory contents, so
      # its self-test needs no build either.
      #
      # Its defect is also a silence, in the flattering direction rather than
      # the shrinking one this job's other two guard against: an unbounded,
      # recursive `find` picked up 2,445 stale .profraw files left by prior
      # runs, with nothing that ever deleted them, and folded their counts
      # into the current report as if they belonged to it (morph#430). A gate
      # that had gone blind to an empty profile set would report exactly the
      # same green this one does when a real run's data is present.
      - name: Self-test the coverage-profiles checker
        run: bash scripts/test_check_coverage_profiles.sh

      # scripts/check_coverage_roots.sh, on the same terms: the gate itself runs
      # inside scripts/coverage.sh (it needs the built objects and the merged
      # profile), and its self-test reads hand-written `llvm-cov export
      # -summary-only` documents, so it needs neither.
      #
      # Its defect is a silence too, and a wider one. A shared compiler cache
      # served objects built in another worktree; clang had embedded that
      # worktree's absolute paths in their coverage mappings; coverage.sh
      # filters by relative path, so those records matched nothing and were
      # dropped -- 246 of 688 in the run that found it, and with them the whole
      # of examples/crm/src/models, whose tests ran and passed throughout
      # (morph#426). Nothing in the pipeline returned nonzero.
      - name: Self-test the coverage-roots checker
        run: bash scripts/test_check_coverage_roots.sh

      # scripts/check_branch_coverage.py, on the same terms: the gate itself
      # runs inside scripts/coverage.sh (it reads the aggregated LCOV that leg
      # produces), and its self-test needs only hand-written fixtures.
      #
      # This one guards a defect with no other trace at all. A branch taken one
      # way only executes its line, so the line percentage is unmoved, Codecov
      # is content, and nothing anywhere reports it -- there are 179 such lines
      # in include/morph today (morph#404). A gate that had gone blind to that
      # would produce exactly the output a healthy one produces.
      - name: Self-test the branch-coverage checker
        run: python3 scripts/check_branch_coverage.py --self-test

      # scripts/check_error_path_coverage.py, on the same terms: it also reads
      # the aggregated LCOV scripts/coverage.sh produces, and its self-test
      # needs only hand-written fixture headers and a hand-written LCOV
      # fragment.
      #
      # This one measures a question no other instrument in the repository
      # answers: not "was this line executed" but "did a test drive this
      # specific throw statement or catch arm" (morph#406). Line coverage
      # cannot tell the difference between a throw that ran because a test
      # exercised the failure and one that ran only because the happy path
      # passes through it; a catch arm that swallows the wrong thing changes
      # nothing an ordinary assertion observes. morph#347 and morph#348 were
      # both exactly that shape, both in include/morph/core, both live in
      # production before anyone noticed.
      - name: Self-test the error-path coverage checker
        run: python3 scripts/check_error_path_coverage.py --self-test

  # ── The wire/action surface <-> the scenario corpus that covers it ──────
  # scripts/scenario/scenario_coverage.py enumerates two surfaces straight out
  # of the source -- every envelope kind and refusal RemoteServer can put on
  # the wire (include/morph/core/remote.hpp, wire.hpp), and every action each
  # server rung registers (BRIDGE_REGISTER_ACTION under examples/<rung>/) --
  # and diffs both against what scripts/scenario/scenarios/ actually sends and
  # asserts. It compiles nothing and starts nothing, which is what lets it run
  # here rather than in the build matrix.
  #
  # The drift it catches is the ordinary kind: a new action registered with no
  # scenario reaching it, a new refusal added to remote.hpp that nothing
  # asserts, an allowlist entry left behind after the thing it exempted became
  # coverable (audited in both directions, so a stale entry fails too), or a
  # scenario edited until it no longer qualifies as a workflow. Every one of
  # those leaves the corpus quietly measuring less than it did, which is
  # exactly the failure mode the report was built for and the reason it is
  # worth a gate rather than a habit.
  #
  # What this job does NOT do is *run* the corpus: that needs the five
  # ladder_<rung>_server binaries built, which is a build this workflow does
  # not have and would stop being fast and dependency-free to acquire. Running
  # scripts/scenario/run_scenarios.py in CI is its own change -- see the PR
  # that added the corpus.
  #
  # No path filter, on the same reasoning as rung-filter-lint above: the
  # surface this tracks is spread across include/, examples/ and
  # scripts/scenario/, and a filter that missed one of them would reproduce the
  # drift it exists to catch.
  scenario-coverage:
    name: Wire & action surface vs. the scenario corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The gate itself is tested first, on the same terms as prose-lint and
      # rung-filter-lint above: a lint gate nobody tests reports green whether
      # or not it still detects anything. This self-test drives
      # scenario_coverage.py against fixtures whose right answers are known --
      # including one where the correct exit code is non-zero -- and pins the
      # real corpus's own exit code, so a change that silently stops the
      # shipped scenarios covering their own surface fails here.
      #
      # Standard library only, and no server: scripts/scenario/README.md's
      # "Self-test" section states the same.
      - name: Self-test the scenario runner and the coverage report
        run: python3 scripts/scenario/test_morph_scenario.py

      - name: Check every envelope kind, refusal and registered action is covered or exempt
        run: python3 scripts/scenario/scenario_coverage.py
