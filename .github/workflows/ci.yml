          key: sccache-clang-asan-${{ github.sha }}

  linux-all-features:
    name: Linux / all optional features (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang additionally builds the libFuzzer harnesses, which require it.
          - compiler: clang
            preset: clang-debug
            fuzzers: 'ON'
          - compiler: gcc
            preset: gcc-debug
            fuzzers: 'OFF'
