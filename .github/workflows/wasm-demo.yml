name: WASM Demo

# Builds the generic client (examples/client) for WebAssembly, running bank's
# screens in process over bank's in-memory models, and publishes it to GitHub
# Pages under /demo/, alongside the Doxygen docs at the site root.
# Single-threaded Qt-for-WASM ⇒ no SharedArrayBuffer ⇒ no COOP/COEP headers ⇒
# plain Pages hosting works.

on:
  push:
    branches:
      - master
    paths:
      - 'examples/bank/**'
      - 'examples/client/**'
      - 'examples/common/app/**'
      - 'examples/forms/screens/**'
      - 'examples/gallery/**'
      - 'include/morph/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm-demo.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'examples/bank/**'
      - 'examples/client/**'
      - 'examples/common/app/**'
      - 'examples/forms/screens/**'
      - 'examples/gallery/**'
      - 'include/morph/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm-demo.yml'

concurrency:
  group: wasm-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_VERSION: 6.10.0
  EMSDK_VERSION: 4.0.7    # the emscripten Qt 6.10 was built against

jobs:
  build-wasm:
    name: Build & deploy WASM demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CPM's source cache (CMakeLists.txt defaults CPM_SOURCE_CACHE to
      # .cache/cpm): restored, a configure clones nothing; missed, it clones
      # and this step saves the result for the next run.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build

      # aqtinstall gives a matched host + wasm Qt pair (same cmake glue), so no
      # host/target version skew.
      - name: Install Qt (host desktop)
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          dir: ${{ runner.temp }}/qt

      # Qt 6.7+ ships WebAssembly under host=all_os / target=wasm (not
      # linux/desktop). The matching host desktop Qt above provides the tools.
      - name: Install Qt (wasm, single-threaded)
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: qtwebsockets
          dir: ${{ runner.temp }}/qt

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: |
          export EM_CACHE="$PWD/.emcache"
          mkdir -p "$EM_CACHE"
          HOST=${{ runner.temp }}/qt/Qt/${{ env.QT_VERSION }}/gcc_64
          WASM=${{ runner.temp }}/qt/Qt/${{ env.QT_VERSION }}/wasm_singlethread
          # The all_os/wasm package extracts its scripts without the exec bit.
          chmod +x "$WASM"/bin/* || true
          # MinSizeRel: this bundle is downloaded by every visitor, so payload
          # size matters more than speed, and an unoptimized Emscripten build
          # exceeds GitHub's 100 MB file limit.
          "$WASM/bin/qt-cmake" -S . -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DQT_HOST_PATH="$HOST" \
            -DMORPH_BUILD_EXAMPLES=ON -DMORPH_BUILD_BANK_EXAMPLE=ON \
            -DMORPH_BUILD_TESTS=OFF \
            -DMORPH_BUILD_QT=ON -DMORPH_BUILD_QT_QUICK=ON

      - name: Build
        run: |
          export EM_CACHE="$PWD/.emcache"
          cmake --build build-wasm --target morph_examples_client

      - name: Stage bundle
        run: |
          mkdir -p site
          BIN=build-wasm/examples/client
          cp "$BIN"/morph_examples_client.js "$BIN"/morph_examples_client.wasm "$BIN"/qtloader.js site/
          # GitHub rejects any single file over 100 MB on push. Fail here, in
          # the build log, rather than in the deploy step's git-push error.
          ls -la site/
          WASM_BYTES=$(stat -c%s site/morph_examples_client.wasm)
          echo "morph_examples_client.wasm: $WASM_BYTES bytes"
          if [ "$WASM_BYTES" -gt 104857600 ]; then
            echo "::error::morph_examples_client.wasm is $WASM_BYTES bytes, over GitHub's 100 MB push limit"
            exit 1
          fi
          # Serve the Qt loader page as the directory index.
          cp "$BIN"/morph_examples_client.html site/index.html

      - name: Deploy to GitHub Pages (/demo)
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          target-folder: demo
          clean: false   # leave the Doxygen docs at the site root untouched
